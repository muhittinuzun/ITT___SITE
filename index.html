                                            <p className="text-apple-gray">info@ittyazilim.com</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-5">
                                        <div className="w-12 h-12 rounded-2xl bg-gray-50 flex items-center justify-center text-apple-text text-xl">
                                            <i className="fa-solid fa-phone"></i>
                                        </div>
                                        <div>
                                            <h4 className="text-apple-text font-bold mb-1">{t.contact.phoneTitle}</h4>
                                            <p className="text-apple-gray"><a href="tel:+905332685783" className="hover:text-apple-blue transition-colors">+90 533 268 57 83</a></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-gray-50 p-8 md:p-10 rounded-[2.5rem] shadow-sm border border-gray-100">
                                <form className="space-y-5" onSubmit={handleSubmit}>
                                    <div className="grid md:grid-cols-2 gap-5">
                                        <input type="text" name="name" placeholder={t.contact.name} required className="w-full bg-white border border-gray-200 rounded-xl p-4 text-apple-text focus:border-apple-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all" />
                                        <input type="text" name="phone" placeholder={t.contact.phone} required className="w-full bg-white border border-gray-200 rounded-xl p-4 text-apple-text focus:border-apple-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all" />
                                    </div>
                                    <input type="email" name="email" placeholder={t.contact.email} required className="w-full bg-white border border-gray-200 rounded-xl p-4 text-apple-text focus:border-apple-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all" />
                                    <textarea rows="4" name="message" placeholder={t.contact.msg} required className="w-full bg-white border border-gray-200 rounded-xl p-4 text-apple-text focus:border-apple-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all"></textarea>
                                    
                                    <button 
                                        type="submit" 
                                        onClick={(e) => { isTestRef.current = e.shiftKey; }}
                                        disabled={formStatus === 'submitting'} 
                                        className={`w-full py-4 rounded-xl text-white font-bold text-lg transition-all flex items-center justify-center gap-2 group ${formStatus === 'submitting' ? 'bg-gray-400 cursor-not-allowed' : 'bg-apple-text hover:bg-black hover:shadow-lg'}`}
                                    >
                                        {formStatus === 'submitting' ? (
                                            <><i className="fa-solid fa-circle-notch fa-spin"></i></>
                                        ) : (
                                            <>{t.contact.btn} <i className="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i></>
                                        )}
                                    </button>
                                    
                                    {formStatus === 'success' && (
                                        <div className="p-4 bg-green-50 text-green-700 rounded-xl text-center font-medium">
                                            <i className="fa-solid fa-check-circle mr-2"></i> {t.contact.success}
                                        </div>
                                    )}
                                    
                                    {formStatus === 'error' && (
                                        <div className="p-4 bg-red-50 text-red-700 rounded-xl text-center font-medium">
                                            <i className="fa-solid fa-circle-exclamation mr-2"></i> {serverError || t.contact.error}
                                        </div>
                                    )}
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const DetailModal = ({ item, isOpen, onClose, onNext, onPrev, isRTL, t }) => {
            if (!isOpen || !item) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 animate-fade-in">
                    <div className="absolute inset-0 bg-white/80 backdrop-blur-md transition-opacity" onClick={onClose}></div>
                    <div className="relative bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl shadow-2xl flex flex-col md:flex-row border border-gray-100">
                        {item.image_url && (
                            <div className="w-full md:w-1/3 h-64 md:h-auto relative">
                                <img src={item.image_url} alt={decodeText(item.title)} className="w-full h-full object-cover" />
                                <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent md:bg-gradient-to-r md:from-transparent md:to-black/10"></div>
                            </div>
                        )}
                        <div className="p-10 flex-1 flex flex-col">
                            <button onClick={onClose} className={`absolute top-6 ${isRTL ? 'left-6' : 'right-6'} w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition-colors z-10`}>
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                            <div className="mb-8 mt-4 md:mt-0">
                                <span className="text-apple-blue text-xs font-bold uppercase tracking-wider bg-blue-50 px-3 py-1 rounded-full mb-4 inline-block">
                                    {decodeText(item.category)}
                                </span>
                                <h2 className="text-3xl font-bold text-apple-text mb-3 leading-tight">{decodeText(item.title)}</h2>
                                {item.display_date && <div className="text-apple-gray text-sm font-medium"><i className="fa-regular fa-calendar mr-2"></i>{item.display_date}</div>}
                            </div>
                            <div className="prose prose-slate max-w-none text-apple-text mb-8 overflow-y-auto custom-scroll leading-relaxed" 
                                 dangerouslySetInnerHTML={{ __html: decodeText(item.content) }} />
                            <div className="mt-auto flex justify-between pt-6 border-t border-gray-100">
                                <button onClick={onPrev} className="flex items-center gap-2 text-apple-gray hover:text-apple-text transition-colors font-medium">
                                    <i className={`fa-solid fa-arrow-${isRTL ? 'right' : 'left'}`}></i> {t.modal.prev}
                                </button>
                                <button onClick={onNext} className="flex items-center gap-2 text-apple-gray hover:text-apple-text transition-colors font-medium">
                                    {t.modal.next} <i className={`fa-solid fa-arrow-${isRTL ? 'left' : 'right'}`}></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Footer = ({ t }) => (
            <footer className="bg-gray-50 border-t border-gray-200 py-16 text-sm">
                <div className="container mx-auto px-6 grid md:grid-cols-4 gap-12 text-apple-gray">
                    <div className="md:col-span-1">
                        <div className="flex items-center gap-2 mb-6">
                            <div className="w-8 h-8 bg-apple-text rounded-md flex items-center justify-center text-white text-xs">
                                <i className="fa-solid fa-code"></i>
                            </div>
                            <span className="font-bold text-apple-text">ITT TEKNOLOJİ</span>
                        </div>
                        <p className="leading-relaxed text-xs">
                            Information Transformation Technology.<br/>
                            Veriyi bilgiye, bilgiyi değere dönüştürüyoruz.
                        </p>
                    </div>
                    <div>
                        <h4 className="text-apple-text font-bold mb-4">Adres</h4>
                        <p className="text-xs leading-loose">
                            Muallimköy Mah. Deniz Cad.<br/>
                            Muallimköy T.G.B. 1.Etap 1.1.C1 Blok<br/>
                            No: 143/8 İç Kapı No: 201<br/>
                            Gebze / Kocaeli / TÜRKİYE
                        </p>
                    </div>
                    <div>
                        <h4 className="text-apple-text font-bold mb-4">Site Haritası</h4>
                        <ul className="space-y-3 text-xs font-medium">
                            <li><a href="#products" className="hover:text-apple-blue transition-colors">Ürünler</a></li>
                            <li><a href="#services" className="hover:text-apple-blue transition-colors">Hizmetler</a></li>
                            <li><a href="#blog" className="hover:text-apple-blue transition-colors">Blog</a></li>
                            <li><a href="#contact" className="hover:text-apple-blue transition-colors">İletişim</a></li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="text-apple-text font-bold mb-4">Sosyal Medya</h4>
                         <div className="flex gap-4">
                            <a href="#" className="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-apple-blue hover:text-white transition-all border border-gray-100"><i className="fa-brands fa-linkedin-in"></i></a>
                            <a href="#" className="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-apple-blue hover:text-white transition-all border border-gray-100"><i className="fa-brands fa-twitter"></i></a>
                            <a href="#" className="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center hover:bg-apple-blue hover:text-white transition-all border border-gray-100"><i className="fa-brands fa-instagram"></i></a>
                        </div>
                    </div>
                </div>
                <div className="text-center mt-16 pt-8 border-t border-gray-200 text-xs text-gray-400">
                    &copy; 2026 ITT TEKNOLOJİ A.Ş. Tüm hakları saklıdır.
                </div>
            </footer>
        );

        // --- APP ROOT ---
        const App = () => {
            const [lang, setLang] = useState('tr');
            const [dbItems, setDbItems] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);
            
            const t = UI_LABELS[lang];

            useEffect(() => {
                const fetchData = async () => {
                    setIsLoading(true);
                    const client = await waitForSupabase();
                    
                    if (!client) {
                        setError("MISSING_KEYS");
                        setIsLoading(false);
                        return;
                    }
                    
                    try {
                        const { data, error } = await client
                            .from('site_content')
                            .select('*')
                            .eq('is_active', true)
                            .order('created_at', { ascending: false }); 
                        
                        if (error) throw error;
                        
                        setDbItems(data || []);
                        setError(null);
                    } catch (err) {
                        console.error("Supabase Error:", err);
                        setError("FETCH_ERROR");
                    } finally {
                        setIsLoading(false);
                    }
                };
                
                fetchData();
            }, []);

            // Filter & Navigation Logic
            const currentItems = useMemo(() => {
                if (!selectedItem) return [];
                return dbItems.filter(i => i.type === selectedItem.type && i.lang === lang);
            }, [selectedItem, lang, dbItems]);

            const handleNext = () => {
                const idx = currentItems.findIndex(i => i.id === selectedItem.id);
                setSelectedItem(currentItems[(idx + 1) % currentItems.length]);
            };

            const handlePrev = () => {
                const idx = currentItems.findIndex(i => i.id === selectedItem.id);
                setSelectedItem(currentItems[(idx - 1 + currentItems.length) % currentItems.length]);
            };

            useEffect(() => {
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            }, [lang]);

            return (
                <div className="min-h-screen flex flex-col bg-apple-bg font-sans text-apple-text">
                    <Navbar lang={lang} setLang={setLang} t={t} />
                    <Hero t={t} />
                    <TechStack />
                    
                    {/* Content Sections */}
                    <ContentSection id="products" type="product" title={t.titles.products} items={dbItems} onSelect={setSelectedItem} lang={lang} t={t} isLoading={isLoading} />
                    <ContentSection id="services" type="service" title={t.titles.services} items={dbItems} onSelect={setSelectedItem} lang={lang} t={t} isLoading={isLoading} />
                    <ContentSection id="blog" type="blog" title={t.titles.blog} items={dbItems} onSelect={setSelectedItem} lang={lang} t={t} isLoading={isLoading} />
                    
                    <Contact t={t} />

                    <DetailModal 
                        item={selectedItem} 
                        isOpen={!!selectedItem} 
                        onClose={() => setSelectedItem(null)}
                        onNext={handleNext}
                        onPrev={handlePrev}
                        isRTL={lang === 'ar'}
                        t={t}
                    />

                    <Footer t={t} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
